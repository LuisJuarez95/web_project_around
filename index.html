<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Luis MJ" />
    <meta name="description" content="Around the U.S. - Comparte y descubre fotos de lugares de EE. UU." />
    <meta name="keywords" content="viajes, fotos, lugares, EE. UU., galería" />
    <title>Around The U.S.</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/logo.svg" alt="Logo de Around The U.S." class="header__logo" />
      </header>

      <main class="content">
        <section class="profile">
          <img src="./images/avatar.png" alt="Foto de perfil" class="profile__avatar" />
          <div class="profile__info">
            <div class="profile__heading">
              <h1 class="profile__name">Jacques Cousteau</h1>
              <button type="button" class="profile__edit-button" aria-label="Editar perfil"></button>
            </div>
            <p class="profile__about">Explorador</p>
          </div>
          <button type="button" class="profile__add-button" aria-label="Añadir tarjeta"></button>
        </section>

        <section class="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">© 2026. Luis Gerardo Matehuala Juárez.</p>
      </footer>
    </div>

    <div class="popup popup_type_edit">
      <div class="popup__container">
        <button type="button" class="popup__close" aria-label="Cerrar"></button>
        <h2 class="popup__title">Editar perfil</h2>
        <form class="popup__form" name="edit-profile" novalidate>
          <input
            type="text"
            name="name"
            class="popup__input popup__input_type_name"
            placeholder="Nombre"
            minlength="2"
            maxlength="40"
            required
          />
          <input
            type="text"
            name="about"
            class="popup__input popup__input_type_about"
            placeholder="Acerca de mí"
            minlength="2"
            maxlength="200"
            required
          />
          <button type="submit" class="popup__save-button">Guardar</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_new-card">
      <div class="popup__container">
        <button type="button" class="popup__close" aria-label="Cerrar"></button>
        <h2 class="popup__title">Nuevo lugar</h2>
        <form class="popup__form" name="new-card" novalidate>
          <input
            type="text"
            name="name"
            class="popup__input popup__input_type_card-name"
            placeholder="Nombre del lugar"
            minlength="2"
            maxlength="30"
            required
          />
          <input
            type="url"
            name="link"
            class="popup__input popup__input_type_url"
            placeholder="Enlace a la imagen"
            required
          />
          <button type="submit" class="popup__save-button">Crear</button>
        </form>
      </div>
    </div>

    <div class="popup popup_type_image">
      <div class="popup__container popup__container_type_image">
        <button type="button" class="popup__close" aria-label="Cerrar"></button>
        <img src="" alt="" class="popup__image" />
        <p class="popup__caption"></p>
      </div>
    </div>

    <template class="card-template">
      <li class="card">
        <img src="" alt="" class="card__image" />
        <button type="button" class="card__delete-button" aria-label="Eliminar"></button>
        <div class="card__info">
          <h2 class="card__title"></h2>
          <button type="button" class="card__like-button" aria-label="Me gusta"></button>
        </div>
      </li>
    </template>

    <script src="./scripts/index.js" defer></script>
  </body>
</html>
